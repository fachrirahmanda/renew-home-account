<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Renew Home Account</title>
    <meta name="description" content="Manage your home account renewal with ease." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Basis design system from Cloudflare Pages -->
    <link rel="stylesheet" href="https://design-system-bc6.pages.dev/v1/ds.css" />
    <script type="module" src="https://design-system-bc6.pages.dev/v1/ds.js"></script>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <style>
      /* Preloader: show branding while the app loads. Inline to paint first. */
      html { background: #fafafa; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #000; } }
      html[data-theme='dark'] { background: #000; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; animation: boot-in 0.3s ease 0.15s both; }
      .boot svg { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 8px 28px rgb(0 0 0 / 0.18); }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.94); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Renew Home Account">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs><linearGradient id="boot-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2a" /><stop offset="1" stop-color="#050505" /></linearGradient></defs>
          <rect width="32" height="32" rx="8" fill="url(#boot-g)" />
          <rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="none" stroke="#fff" stroke-opacity=".14" />
          <circle cx="16" cy="16" r="6" fill="none" stroke="#fff" stroke-width="2" opacity=".5" style="animation: boot-spin 1s linear infinite;" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      @keyframes boot-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
  </body>
</html>
